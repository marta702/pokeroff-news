# type:  auto (RSS-автопоиск, иначе HTML) | rss | html | telegram | youtube | reddit | google_news | twitch | rsshub
# group: competitor | own | room | media | community | influencer
# Необязательные поля: keywords: [...] — фильтр по словам; selector / url_pattern / min_title — для html; disabled: true

sources:
  # --- Сайты и форумы ---
